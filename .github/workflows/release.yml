# Every push and pull request builds the image for both platforms. On main, semantic-release then decides from the
# Conventional Commits whether this is a release (feat: minor, fix:/perf: patch, a breaking change major; chore, docs,
# style, refactor and test release nothing), creates the tag and the GitHub release, and the image is pushed to
# ghcr.io/<owner>/<repository> as <version>, <major>.<minor>, <major> and latest.
#
# The tag is created with the workflow's own GITHUB_TOKEN, and a tag pushed by that token starts no workflow, which is
# why the image is pushed by this same job rather than by a tag-triggered one.
name: build and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # tag and GitHub release
      issues: write         # semantic-release comments on the issues a release closes
      pull-requests: write
      packages: write       # push to ghcr.io
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build first: a commit whose image does not build must not become a release.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -y \
            -p semantic-release@24.2.3 \
            -p conventional-changelog-conventionalcommits@8.0.0 \
            semantic-release
          tag="$(git tag --points-at HEAD --list 'v*' | head -n1)"
          if [ -n "$tag" ]; then echo "version=${tag#v}" >> "$GITHUB_OUTPUT"; fi

      - name: Image tags
        if: steps.release.outputs.version != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }}
            type=raw,value=latest
      - if: steps.release.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: steps.release.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: APP_VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
